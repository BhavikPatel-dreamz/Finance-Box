query PostBySlug($slug: ID!) {
  post(id: $slug, idType: SLUG) {
    ...PostCard
    status
  }
}

query PostsList($first: Int!, $after: String) {
  posts(first: $first, after: $after, where: { status: PUBLISH, orderby: { field: DATE, order: DESC } }) {
    pageInfo { hasNextPage endCursor }
    nodes { ...PostCard }
  }
}
